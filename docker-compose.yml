services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: tutorai
      POSTGRES_USER: tutorai
      POSTGRES_PASSWORD: tutorai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorai -d tutorai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - tutorai-data:/data
    environment:
      DATABASE_URL: postgresql+psycopg://tutorai:tutorai@postgres:5432/tutorai
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  tutorai-data:
  postgres-data:
